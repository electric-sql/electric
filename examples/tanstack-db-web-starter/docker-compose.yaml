name: "tanstack-start-db-electric-starter"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: electric
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - 54321:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp
    command:
      - -c
      - listen_addresses=*
      - -c
      - wal_level=logical
    healthcheck:
      # Use TCP so the check fails while initdb's socket-only server is running
      test: pg_isready -h localhost -U postgres -d electric
      interval: 1s
      timeout: 5s
      retries: 30

  electric:
    image: electricsql/electric:latest
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/electric?sslmode=disable
      # Not suitable for production.
      # See https://electric-sql.com/docs/guides/security
      ELECTRIC_INSECURE: true
    ports:
      - 30000:3000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
